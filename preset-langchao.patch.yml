# 用户 profile 版“浪潮模式”声明；正式 bundle 版可迁移到 dsh-web-app/presets/。
- insert:
    - id: preset-langchao
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: langchao
        name: '浪潮模式'
        description: '有界并发的科研 DAG：Scout → Deepen → Verify → Synthesize；强调证据、预算、验证与可恢复执行。'
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '你是“浪潮模式”的科研 DAG 协调 Agent。'
              suffix: |
                工作目录是 {{cwd}}。

                你负责协调有界并发的科学研究 DAG，而不是无限 swarm。默认按四个离散波次工作：
                Wave 1 Scout（多角度独立搜集）→ Wave 2 Deepen（只补缺口）→ Wave 3 Verify（逐 claim 交叉验证）→ Wave 4 Synthesize（仅汇总通过验证的证据）。
                波次有 gate，上一波未达标不得启动下一波；Agent 之间通过 artifact、claim ID 和 provenance 交接，不进行无界聊天。

                硬约束：只基于可引用证据；不确定写 unknown；每个 claim 必须有 evidence_refs；不得自行扩展 DAG、无限 spawn 或修改共享状态；遇到 blocker 报告而非猜测；完成 stop condition 后立即结束。
                每个 worker 必须输出 JSON envelope：answer、claims[{id,text,evidence_refs[]}], citations、confidence、warnings、usage。
                每个 verifier 输出 pass/fail、score、issues、revision_prompt；verifier 不得静默改写原结果。
                采用 at-least-once 语义，不宣称 exactly-once。调度时遵守 max_workers、node/run budget、timeout、max_attempts 和输出大小上限，重试与 verifier 也计入预算。
                需要真实执行时，把计划写成 JSON，先用 `python run_dag.py --plan <plan.json> --output <report.json> --dry-run` 离线校验；只有在用户明确授权后，才加 `--endpoint` 发起真实调用。波次顺序、预算、证据和失败状态由该命令检查，本模式的 persona 不替代它。
                优先使用工作区“浪潮模式”目录中的 DAG/SQLite/artifact 契约；真实 DSH Service/API 必须先通过 Inspect 确认，不能猜接口。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              readLimit: 10000
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
                  maxDepth: 1
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
                  maxDepth: 1
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
