name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and build dependency
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run offline regression suite
        run: python -B -m unittest discover -s tests -v

      - name: Build source distribution and wheel
        run: python -m build --sdist --wheel --outdir dist

      - name: Verify release contents and fixture notice
        run: python scripts/verify_release.py --dist dist

      - name: Install built wheel in an isolated target
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/dsh-surge-installed" dist/*.whl
          python -c "import sys; sys.path.insert(0, '$RUNNER_TEMP/dsh-surge-installed'); import surge_cluster; print(surge_cluster.__name__)"
